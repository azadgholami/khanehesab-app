<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17283f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خانه‌حساب">
<meta name="mobile-web-app-capable" content="yes">
<title>خانه‌حساب | مدیریت مالی خانواده</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#17283f;--mut:#6b7686;--line:#e4e0d8;--in:#1f8a70;--out:#d9534f;--gold:#e0a63a;--navy:#17283f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2b;--card:#182b44;--ink:#eef1f5;--mut:#9aa7b8;--line:#263a57;--in:#3cc9a5;--out:#ff7a73;--navy:#0b1422}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}
.hero small{opacity:.7}.hero .big{font-size:32px;font-weight:800;margin:2px 0 14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pill{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.pill b{display:block;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:18px 0 10px}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}.it .t{flex:1;min-width:0}.it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t span{font-size:12.5px;color:var(--mut)}
.in{color:var(--in)}.out{color:var(--out)}.amt{font-weight:700;white-space:nowrap}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.ic{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 16px;background:var(--navy);color:#fff;cursor:pointer;min-height:46px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:#17283f}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;font:inherit;font-size:11.5px;background:none;border:0;color:var(--mut);padding:6px 0;cursor:pointer}
nav button span{display:block;font-size:21px;line-height:1.2}nav button.on{color:var(--ink);font-weight:800}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:18px;width:58px;height:58px;border-radius:50%;background:var(--gold);color:#17283f;font-size:30px;border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6;cursor:pointer}
@media print{body>*:not(#sh){display:none!important}.sheet.show{position:static!important;background:none!important;display:block!important}.sheet>div{max-height:none!important;border-radius:0!important;max-width:none!important}.noprint{display:none!important}}
[dir=ltr] .fab{left:auto;right:18px}
.sheet{position:fixed;inset:0;background:rgba(10,18,30,.55);display:none;align-items:flex-end;z-index:10}
.sheet.show{display:flex}.sheet>div{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;font:inherit;border:0;border-radius:11px;padding:10px;background:none;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.note{font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="ثبت جدید">＋</button>
<nav id="nav"></nav>
<div class="sheet" id="sh"><div id="shb"></div></div>
<script>
const $=s=>document.querySelector(s);
let S={tx:[],db:[],m:{},w:{},cur:'تومان'},tab='home',ty='out',dk='بدهی';
try{S=Object.assign(S,JSON.parse(localStorage.getItem('khanehesab')||'{}'))}catch(e){}
const save=()=>{const j=JSON.stringify(S);idbSet(j);if(AU)schedSync();try{if(j.length<4e6)localStorage.setItem('khanehesab',j);else localStorage.removeItem('khanehesab')}catch(e){}return;try{localStorage.setItem('khanehesab',j)}catch(e){tt('حافظه پر است. پشتیبان بگیر و چند رسید قدیمی را حذف کن.')}};
const f=n=>Number(n||0).toLocaleString('fa-IR')+' '+S.cur;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const GL={fa:'en-GB',en:'en-GB',ar:'ar-EG',tr:'tr-TR',fr:'fr-FR',de:'de-DE'};
const fd=d=>{try{const x=new Date(d),G=x.toLocaleDateString(GL[LG]||'en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});return (LG=='fa'?x.toLocaleDateString('fa-IR',{timeZone:'UTC'})+' ('+G+')':G+' ('+g2j(...T3(d)).join('/')+')')+' • '+x.toLocaleDateString(LG+'-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}catch(e){return d}};
let UD=null;function tt(m,u){let e=$('#tst');if(!e){e=document.createElement('div');e.id='tst';e.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;z-index:20;display:flex;justify-content:space-between;align-items:center;max-width:616px;margin:0 auto';document.body.appendChild(e)}e.innerHTML='<span>'+m+'</span>'+(u?'<button class="btn gold" style="min-height:36px;padding:6px 12px" onclick="undo()">بازگردانی</button>':'');e.style.display='flex';clearTimeout(tt.t);tt.t=setTimeout(()=>e.style.display='none',4000)}
function undo(){if(UD){UD.a.splice(UD.i,0,UD.x);UD=null;save();render();$('#tst').style.display='none'}}
const CATS=['خوراک','مسکن','قبوض','حمل‌ونقل','درمان','آموزش','تفریح','پس‌انداز','حقوق','فروش','سایر'];
const EM={'خوراک':'🍽️','مسکن':'🏠','قبوض':'💡','حمل‌ونقل':'🚗','درمان':'💊','آموزش':'📚','تفریح':'🎈','پس‌انداز':'🐖','حقوق':'💼','فروش':'🛍️','سایر':'📦'};
const TABS=[['home','🏠','خانه'],['tx','🧾','تراکنش‌ها'],['db','🤝','بدهی و طلب'],['more','⚙️','بیشتر']];
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');$('#fab').style.display=tab=='more'||/^m:(bud|rep|cal|acc|rec|fx)$/.test(tab)?'none':'block'}
function go(t){tab=t;render();scrollTo(0,0)}
function rc(r){return r?`<img class="th" src="${r}" onclick="view(this.src)" alt="رسید">`:''}
function txRow(t,i){return `<div class="it">${t.r?rc(t.r):`<div class="ic">${EM[t.c]||'📦'}</div>`}<div class="t"><b>${esc(t.n)}</b><span>${t.c} • ${fd(t.d)}</span></div><div class="amt ${t.t=='in'?'in':'out'}">${t.t=='in'?'+':'−'}${f(t.a)}</div><button class="x" onclick="ed('tx',${i})" aria-label="ویرایش">✎</button>${t.inv?`<button class="x" onclick="vi(${i})" aria-label="فاکتور">🧾</button>`:''}<button class="x" onclick="del('tx',${i})" aria-label="حذف">✕</button></div>`}
function render(){nav();let h='';
const m=today().slice(0,7);
if(tab=='home'){
const mt=S.tx.filter(t=>t.d.startsWith(m)),inc=mt.filter(t=>t.t=='in').reduce((s,t)=>s+t.a,0),exp=mt.filter(t=>t.t=='out').reduce((s,t)=>s+t.a,0);
const owe=S.db.filter(d=>!d.p&&d.k=='بدهی').reduce((s,d)=>s+rem(d),0),own=S.db.filter(d=>!d.p&&d.k=='طلب').reduce((s,d)=>s+rem(d),0);
h=`<div class="hero"><small>مانده این ماه</small><div class="big">${f(inc-exp)}</div><div class="row"><div class="pill"><small>درآمد</small><b>${f(inc)}</b></div><div class="pill"><small>هزینه</small><b>${f(exp)}</b></div></div></div>
<div class="row"><div class="card"><small class="note">بدهی باقی‌مانده</small><b class="out" style="display:block">${f(owe)}</b></div><div class="card"><small class="note">طلب وصول‌نشده</small><b class="in" style="display:block">${f(own)}</b></div></div>
<h2>هزینه‌ها به تفکیک دسته</h2><div class="card">${(()=>{const g={};mt.filter(t=>t.t=='out').forEach(t=>g[t.c]=(g[t.c]||0)+t.a);const e=Object.entries(g).sort((a,b)=>b[1]-a[1]);return e.length?e.map(([c,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${EM[c]} ${c}</span><b>${f(v)}</b></div><div class="bar"><i style="width:${Math.round(v/exp*100)}%"></i></div></div>`).join(''):'<div class="empty">هنوز هزینه‌ای این ماه ثبت نشده.</div>'})()}</div>
<h2>آخرین تراکنش‌ها</h2><div class="card">${S.tx.length?S.tx.slice(0,5).map((t,i)=>txRow(t,i)).join(''):'<div class="empty">با دکمه ＋ اولین درآمد یا هزینه را ثبت کن.</div>'}</div>`}
if(tab=='tx')h=`<h2>همه تراکنش‌ها</h2><div class="card">${S.tx.length?S.tx.map(txRow).join(''):'<div class="empty">تراکنشی ثبت نشده. با ＋ شروع کن و عکس رسید را هم ضمیمه کن.</div>'}</div>`;
if(tab=='db')h=`<h2>بدهی‌ها و طلب‌ها</h2><div class="card">${S.db.length?S.db.map((d,i)=>`<div class="it">${d.r?rc(d.r):`<div class="ic">${d.k=='بدهی'?'📤':'📥'}</div>`}<div class="t"><b style="${d.p?'text-decoration:line-through;opacity:.55':''}">${esc(d.w)}</b><span>${d.k}${d.due?' • سررسید '+fd(d.due):''}${d.p?' • تسویه شد':''}</span></div><div class="amt ${d.k=='طلب'?'in':'out'}">${f(d.a)}</div><button class="x" onclick="pay(${i})" aria-label="تسویه">${d.p?'↩':'✓'}</button><button class="x" onclick="del('db',${i})" aria-label="حذف">✕</button></div>`).join(''):'<div class="empty">بدهی یا طلبی ثبت نشده. با ＋ اضافه کن و رسیدش را بگذار.</div>'}</div>`;
if(tab.startsWith('m:')){const k=tab.slice(2);h=({bud:bud,rep:rep,cal:cal,acc:accv,rec:recv,fx:fxv}[k]||mod)(k)}if(tab=='more')h=grid()+`<h2>پشتیبان‌گیری و انتقال به دستگاه دیگر</h2><div class="card"><p class="note" style="margin-top:0">یک فایل پشتیبان بگیر و در گوشی یا رایانه دیگر (اندروید، آیفون یا ویندوز) وارد کن. رسیدها هم داخل فایل هستند.</p><div class="row"><button class="btn" onclick="exp()">گرفتن پشتیبان</button><button class="btn alt" onclick="$('#imp').click()">بازیابی از فایل</button></div><input type="file" id="imp" accept=".json" hidden onchange="imp(this.files[0])"></div>
<h2>زبان | Language</h2><div class="card"><select onchange="setLang(this.value)">${Object.entries(LGS).map(([k,v])=>`<option value="${k}" ${LG==k?'selected':''}>${v}</option>`).join('')}</select></div><h2>واحد پول</h2><div class="card"><select onchange="S.cur=this.value;save();render()">${Object.keys(CN).map(c=>`<option ${S.cur==c?'selected':''}>${c}</option>`).join('')}</select></div>
<p class="note">اطلاعات روی همین دستگاه ذخیره می‌شود. با ورود به حساب (نسخه حرفه‌ای) روی سرور همگام می‌شود.</p>`;
if(tab=='tx')h=txv2();if(tab=='db')h=dbv();if(tab=='more')h+=more2()+accCard()+legalCard();$('#app').innerHTML=h}
function del(k,i){UD={a:S[k],i,x:S[k].splice(i,1)[0]};save();render();tt('حذف شد',1)}
function pay(i){S.db[i].p=!S.db[i].p;save();render()}
function view(s){$('#shb').innerHTML=`<img src="${s}" style="width:100%;border-radius:14px" alt="رسید"><button class="btn" style="width:100%;margin-top:12px" onclick="shut()">بستن</button>`;$('#sh').classList.add('show')}
function shut(){$('#sh').classList.remove('show')}
function open_(){INV=null;if(tab.startsWith('m:'))return addM(tab.slice(2));const isDb=tab=='db';
$('#shb').innerHTML=`<h2 style="margin-top:0">${isDb?'ثبت بدهی یا طلب':'ثبت تراکنش'}</h2>
<div class="seg" id="sg">${isDb?`<button class="${dk=='بدهی'?'on':''}" onclick="dk='بدهی';sg(this)">بدهی (من بدهکارم)</button><button class="${dk=='طلب'?'on':''}" onclick="dk='طلب';sg(this)">طلب (او بدهکار است)</button>`:`<button class="${ty=='out'?'on':''}" onclick="ty='out';sg(this)">هزینه</button><button class="${ty=='in'?'on':''}" onclick="ty='in';sg(this)">درآمد</button>`}</div>
<label>${isDb?'نام شخص':'شرح'}</label><div class="row" style="gap:6px"><input id="f1"><button class="btn alt" style="flex:0 0 54px;padding:0" onclick="mic()" aria-label="ثبت صوتی">🎤</button></div>
<label>مبلغ (${S.cur})</label>${AI('f2')}${isDb?'':`<button class="btn alt" style="width:100%;margin-top:8px" onclick="ib()">🧾 فاکتور چند قلمی</button><div id="inv"></div>`}
${isDb?`<label>تاریخ سررسید (اختیاری)</label>${jd('f3','')}`:`<label>دسته</label><select id="f3" onchange="nc(this)">${catOpts()}</select><label>تاریخ</label>${jd('f4',today())}<label>حساب</label><select id="f6">${ACC().map(a=>`<option>${esc(a.n)}</option>`).join('')}</select>`}
<label>رسید (عکس)</label><input id="f5" type="file" accept="image/*"><button class="btn alt" style="width:100%;margin-top:6px" onclick="ocr()">🔍 خواندن مبلغ از رسید</button>
<div class="row" style="margin-top:18px"><button class="btn" onclick="add(${isDb})">ذخیره</button><button class="btn alt" onclick="shut()">انصراف</button></div>`;
$('#sh').classList.add('show')}
function sg(b){[...b.parentNode.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');const s=$('#f3');if(s&&s.tagName=='SELECT'){s.innerHTML=catOpts();nc(s)}}
function pack(file,cb){if(!file)return cb('');const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};i.src=r.result};r.readAsDataURL(file)}
function add(isDb){const n=$('#f1').value.trim(),a=ev($('#f2').value);if(!n||!a)return tt('نام یا شرح و مبلغ را وارد کن.');
pack($('#f5').files[0],r=>{if(isDb)S.db.unshift({w:n,a,k:dk,due:$('#f3').value,r,p:false});else{S.tx.unshift({n,a,t:ty,c:catV(),d:$('#f4').value||today(),r,inv:(INV&&INV.on)?{rows:INV.rows.filter(x=>x.p>0),disc:INV.disc,tax:INV.tax}:null});S.tx.sort((x,y)=>y.d.localeCompare(x.d))}
save();shut();render()})}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='khanehesab-backup-'+today()+'.json';a.click()}
function imp(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx)||!Array.isArray(d.db))throw 0;if(confirm('اطلاعات فعلی با فایل پشتیبان جایگزین شود؟')){S=Object.assign(S,d);save();render()}}catch(e){tt('این فایل پشتیبان معتبر نیست.')}};r.readAsText(file)}
const MODS={plan:['📅','برنامه روزانه','کار'],inst:['💳','اقساط','قسط'],goal:['🎯','هدف‌ها','هدف'],hab:['✅','عادت‌ها','عادت'],rem:['⏰','یادآورها','یادآور'],note:['📝','شرح روز','یادداشت']};
function grid(){const w=(S.w||{})[today()]||0;return `<h2>ابزارها</h2><div class="row" style="flex-wrap:wrap">${Object.entries(MODS).map(([k,v])=>`<button class="card" style="flex:1 1 40%;font:inherit;color:inherit;cursor:pointer" onclick="go('m:${k}')"><div style="font-size:26px">${v[0]}</div>${v[1]}<div class="note">${'bud rep cal acc rec fx'.includes(k)?'':((S.m||{})[k]||[]).length+' مورد'}</div></button>`).join('')}</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>💧 آب امروز: ${w.toLocaleString('fa-IR')} لیوان</b><span><button class="btn" style="min-height:38px;padding:6px 14px" onclick="wt(1)">＋</button> <button class="btn alt" style="min-height:38px;padding:6px 14px" onclick="wt(-1)">−</button></span></div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:10px">${Array.from({length:Math.max(8,w)},(_,i)=>`<button class="x" style="font-size:30px;opacity:${i<w?1:.25};padding:2px" onclick="ws(${i+1})" aria-label="لیوان">🥛</button>`).join('')}</div><p class="note" style="margin:6px 0 0">روی لیوان بزن تا ثبت شود. ۸ لیوان هدف روزانه است.</p></div>`}
function ws(n){const w=S.w[today()]||0;wt(n==w?-1:n-w)}
function wt(n){S.w=S.w||{};S.w[today()]=Math.max(0,(S.w[today()]||0)+n);save();render()}
function mod(k){const v=MODS[k],L=(S.m||{})[k]||[];return `<button class="btn alt" onclick="go('more')">بازگشت</button><h2>${v[0]} ${v[1]}</h2>${k=='rem'||k=='plan'?'<button class="btn gold" onclick="askN()">🔔 فعال‌سازی هشدار</button>':''}<div class="card">${L.length?L.map((x,i)=>{const dn=k=='hab'?(x.h||[]).includes(today()):x.x;return `<div class="it"><button class="x" style="font-size:22px" onclick="tg('${k}',${i})" aria-label="انجام شد">${dn?'☑':'☐'}</button><div class="t"><b style="${dn&&k!='hab'?'text-decoration:line-through;opacity:.55':''}">${esc(x.t)}</b><span>${x.a?f(x.a)+' ':''}${x.tm?' ⏰ '+x.tm+' ':''}${x.d?'• '+fd(x.d):''}${k=='hab'?'• '+(x.h||[]).length+' روز انجام شده':''}</span></div><button class="x" onclick="dm('${k}',${i})" aria-label="حذف">✕</button></div>`}).join(''):'<div class="empty">خالی است. با ＋ اضافه کن.</div>'}</div>`}
